<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkorApp - Çetele</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🏆 SkorApp</h1>
        <p>Kağıt ve Kutu Oyunları Çetelesi</p>
        
        <div id="app-content">
            <div id="home-screen">
                <button id="start-btn" class="btn-primary">Hızlı Oyun Başlat</button>
            </div>

            <div id="setup-screen" style="display: none;">
                <h2>Oyuncuları Ekle</h2>
                <div class="input-group">
                    <input type="text" id="player-name" placeholder="Oyuncu Adı (Örn: Ahmet)">
                    <button id="add-player-btn" class="btn-secondary">Ekle</button>
                </div>
                <ul id="player-list"></ul>
                
                <div id="game-settings-area" style="margin-bottom: 20px; text-align: left; display: none;">
                    <label style="font-weight: bold; color: #2c4d61; display: block; margin-bottom: 8px;">Kazanma Şartı Nedir?</label>
                    <select id="win-condition" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ced4da; font-size: 16px; background: #fff; color: #333; outline: none;">
                        <option value="high">En Yüksek Puan Kazanır (101, Okey vb.)</option>
                        <option value="low">En Düşük Puan Kazanır (Batak, Uno vb.)</option>
                    </select>
                </div>

                <button id="start-match-btn" class="btn-primary" style="display: none;">Masa Hazır, Başla!</button>
            </div>

            <div id="game-screen" style="display: none;">
                <div class="table-responsive">
                    <table id="score-table">
                        <thead id="score-thead"></thead>
                        <tbody id="score-tbody"></tbody>
                        <tfoot id="score-tfoot"></tfoot>
                    </table>
                </div>
                
                <div class="game-controls">
                    <button id="new-round-btn" class="btn-secondary" style="width: 100%; padding: 12px; margin-bottom: 10px;">➕ Yeni El (Tur) Ekle</button>
                    <button id="end-game-btn" class="btn-primary" style="background-color: #e74c3c;">Oyunu Bitir</button>
                </div>
            </div>

            <div id="end-screen" style="display: none;">
                <h2>🎉 Oyun Bitti! 🎉</h2>
                <div id="podium"></div>
                <button id="restart-btn" class="btn-primary" style="margin-top: 25px;">Yeni Oyun Başlat</button>
            </div>
        </div>
        
        <div id="status-message">Firebase bağlantısı bekleniyor...</div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
